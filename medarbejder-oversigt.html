<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medarbejder oversigt | Den Gamle Gruppe</title>
    <style>
      :root {
        --brand-navy: #0a2342;
        --brand-teal: #1e7a8c;
        --brand-light: #f4f8fb;
        --brand-text: #1b2a38;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(140deg, var(--brand-light), #e7eef6);
        color: var(--brand-text);
      }

      main {
        max-width: 900px;
        margin: 3rem auto;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 14px 35px rgba(10, 35, 66, 0.15);
        padding: 2rem;
      }

      h1 {
        margin-top: 0;
        color: var(--brand-navy);
      }

      .intro {
        border-left: 4px solid var(--brand-teal);
        padding-left: 1rem;
        margin-bottom: 1.5rem;
      }

      .credentials {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }

      label {
        font-weight: 600;
      }

      input {
        border: 1px solid #bdd0de;
        border-radius: 8px;
        padding: 0.55rem 0.65rem;
        min-width: 220px;
      }

      button {
        background: var(--brand-navy);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0.6rem 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #123663;
      }

      #feedback {
        margin-top: 0.75rem;
        min-height: 1.2rem;
        color: #a01818;
      }

      #pdf-area {
        display: none;
        margin-top: 1.4rem;
        border: 1px solid #d2e0ea;
        border-radius: 10px;
        padding: 0.75rem;
      }

      embed {
        width: 100%;
        height: 650px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Medarbejder oversigt</h1>
      <p class="intro">
        Den Gamle Gruppe er et virksomhedsforankret forskningshold for videnskabelig
        musikanalyse. Denne side giver autoriserede medarbejdere adgang til intern
        PDF-dokumentation.
      </p>

      <section>
        <label for="adgangskode">Indtast adgangskode for at åbne dokument:</label>
        <div class="credentials">
          <input id="adgangskode" type="password" autocomplete="current-password" />
          <button id="åbn-pdf" type="button">Åbn PDF</button>
        </div>
        <p id="feedback"></p>
      </section>

      <section id="pdf-area" aria-live="polite">
        <embed src="assets/forskningsoversigt.pdf" type="application/pdf" />
      </section>
    </main>

    <script>
      const password = "dgg2026";
      const button = document.getElementById("åbn-pdf");
      const input = document.getElementById("adgangskode");
      const feedback = document.getElementById("feedback");
      const pdfArea = document.getElementById("pdf-area");

      button.addEventListener("click", () => {
        if (input.value === password) {
          pdfArea.style.display = "block";
          feedback.textContent = "";
        } else {
          pdfArea.style.display = "none";
          feedback.textContent = "Forkert adgangskode. Prøv igen.";
        }
      });
    </script>
  </body>
</html>
